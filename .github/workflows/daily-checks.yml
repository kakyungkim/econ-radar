name: Daily Market Number Check

# 데일리 md가 main에 올라오면 시장 수치를 실제 시세와 대조한다(scripts/check_market_numbers.py --online).
# 걸리는 항목이 있으면 개인 텔레그램 DM(vars.TELEGRAM_ALERT_CHAT_ID)으로 알린다. 발행을 막지는 않는다.
# 배경: 2026-10-03, 10-04 호가 7월 기사의 "코스피 8,000", "원/달러 1,530원대"를 실었다. 클라우드 세션은
# 원문 사이트 대부분에 접속하지 못해 사실 검증이 놓쳤다. GitHub 러너는 FRED와 Yahoo에 접속할 수 있다.
on:
  push:
    branches: [main]
    paths:
      - 'vault/daily/*.md'
  workflow_dispatch:
    inputs:
      date:
        description: '점검할 날짜 (YYYY-MM-DD). 비워두면 이번 push에서 바뀐 데일리.'
        required: false
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Pick dates
        id: dates
        run: |
          D="${{ github.event.inputs.date }}"
          if [ -z "$D" ]; then
            # 새로 추가되거나 바뀐 데일리만. 삭제는 보지 않는다
            D=$(git diff --diff-filter=AM --name-only HEAD~1 HEAD -- 'vault/daily/*.md' | sed -E 's#vault/daily/(.*)\.md#\1#' | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' | tail -3 | tr '\n' ' ')
          fi
          echo "dates=$D" >> "$GITHUB_OUTPUT"
          echo "점검 대상: ${D:-없음}"

      - name: Check numbers
        id: check
        if: steps.dates.outputs.dates != ''
        run: |
          : > report.txt
          FOUND=0
          for D in ${{ steps.dates.outputs.dates }}; do
            if python3 scripts/check_market_numbers.py "$D" --online >> report.txt; then :; else FOUND=1; fi
          done
          cat report.txt
          echo "found=$FOUND" >> "$GITHUB_OUTPUT"

      - name: Alert via Telegram DM
        if: steps.check.outputs.found == '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ vars.TELEGRAM_ALERT_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_ALERT_CHAT_ID" ]; then echo "토큰 또는 chat id 없음"; exit 1; fi
          TEXT="⚠️ econ-radar 시장 수치 확인 필요
          $(head -c 3000 report.txt)
          실행: $RUN_URL"
          RES=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_ALERT_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" -d disable_web_page_preview=true)
          echo "$RES" | grep -q '"ok":true' && echo "DM 발송 완료" || { echo "DM 실패: $RES" | sed 's/bot[0-9]*:[A-Za-z0-9_-]*/bot***/g'; exit 1; }
