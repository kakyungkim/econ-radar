name: Daily Blog Publish

on:
  push:
    branches: [main]
    paths:
      - 'vault/html/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].html'
  workflow_dispatch:
    inputs:
      date:
        description: '발행할 날짜 YYYY-MM-DD'
        required: true

concurrency:
  group: daily-blog-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect date
        id: detect
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          DATE="$INPUT_DATE"
          if [ -z "$DATE" ]; then
            BEFORE="$PUSH_BEFORE"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="HEAD~1"
            fi
            DATE=$(git diff --name-only "$BEFORE" HEAD -- 'vault/html/*.html' | sed -nE 's#vault/html/([0-9]{4}-[0-9]{2}-[0-9]{2})\.html#\1#p' | sort | tail -1)
          fi
          test -n "$DATE" || { echo "발행 날짜 감지 실패"; exit 1; }
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: kakyungkim/kakyungkim.github.io
          token: ${{ secrets.BLOG_DEPLOY_TOKEN }}
          path: blog

      - name: Configure blog commit identity
        run: |
          git -C blog config user.name "econ-radar bot"
          git -C blog config user.email "bot@econ-radar.local"

      - name: Deploy verified HTML
        env:
          DATE: ${{ steps.detect.outputs.date }}
          BLOG: ${{ github.workspace }}/blog
          CONFIRM: '0'
        run: |
          TITLE=$(grep -m1 '^# ' "vault/daily/$DATE.md" | sed 's/^# *//')
          ./deploy.sh "$DATE" "$TITLE"
