name: Daily Watchdog

# 데일리 발행 누락 감시. 매일 22:00 KST에 오늘 날짜의 vault/daily/DATE.md가 main에 있는지 본다.
# 없으면 개인 텔레그램 DM(vars.TELEGRAM_ALERT_CHAT_ID)으로 알린다. 공개 채널로는 보내지 않는다.
# 배경: 2026-10-01 클라우드 루틴이 주간 사용량 한도로 1초 만에 끝났는데 "성공(오류 있음)"으로 기록돼 아무도 몰랐다.
# 재시도는 클라우드 루틴 "econ-radar 데일리 재시도(20:30 KST)"가 맡는다. 이 워크플로는 최종 상태만 본다.
on:
  schedule:
    - cron: '0 13 * * *'   # 13:00 UTC = 22:00 KST
  workflow_dispatch:
    inputs:
      date:
        description: '확인할 날짜 (YYYY-MM-DD). 비워두면 오늘(KST).'
        required: false
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Check today's daily
        id: check
        run: |
          DATE="${{ github.event.inputs.date }}"
          [ -z "$DATE" ] && DATE=$(TZ=Asia/Seoul date +%F)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          if [ -f "vault/daily/$DATE.md" ]; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
            echo "OK: vault/daily/$DATE.md 있음"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
            echo "MISSING: vault/daily/$DATE.md 없음"
          fi

      - name: Alert via Telegram DM
        if: steps.check.outputs.missing == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ vars.TELEGRAM_ALERT_CHAT_ID }}
          DATE: ${{ steps.check.outputs.date }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_ALERT_CHAT_ID" ]; then
            echo "토큰 또는 TELEGRAM_ALERT_CHAT_ID 없음. 알림 생략"; exit 1
          fi
          TEXT="⚠️ econ-radar 데일리 누락: $DATE
          22시까지 vault/daily/$DATE.md가 main에 없습니다.
          원인 확인: claude.ai 루틴 실행 기록(사용량 한도, 저장소 접근 등)
          감시 실행: $RUN_URL"
          RES=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_ALERT_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" -d disable_web_page_preview=true)
          echo "$RES" | grep -q '"ok":true' && echo "DM 발송 완료" || { echo "DM 실패: $RES" | sed 's/bot[0-9]*:[A-Za-z0-9_-]*/bot***/g'; exit 1; }
