name: Telegram Daily Push

# vault/push/YYYY-MM-DD.md 파일이 추가·변경될 때 자동 실행
# 수동 실행: Actions 탭 → Run workflow → date 입력 (YYYY-MM-DD)
on:
  push:
    branches: [main]
    paths:
      - 'vault/push/*.md'
  workflow_dispatch:
    inputs:
      date:
        description: '발송할 날짜 (YYYY-MM-DD). 비워두면 최신 push 파일 자동 감지.'
        required: false
        default: ''

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write   # 실패 시 진단 Issue 자동 생성(notify_failure.py)
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # before..HEAD 전체 범위 비교에 필요

      - name: Detect date
        id: detect
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE="${{ github.event.inputs.date }}"
          else
            BEFORE="${{ github.event.before }}"
            # before가 000...0(새 브랜치)이면 HEAD~1로 대체
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="HEAD~1"
            fi
            DATE=$(git diff --name-only "$BEFORE" HEAD \
              | grep -E '^vault/push/[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$' \
              | sed 's|vault/push/||; s|\.md||' \
              | sort -r | head -1)
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Detected date: $DATE"

      - name: Send Telegram push
        if: steps.detect.outputs.date != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/send_push.py ${{ steps.detect.outputs.date }} 2>&1 | tee -a run_output.log

      # 실패 시: 런북 진단을 붙여 GitHub Issue 생성 + 텔레그램 DM(TELEGRAM_ALERT_CHAT_ID 설정 시)
      - name: Notify failure (진단 → Issue + Telegram DM)
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAIL_TARGET: ${{ steps.detect.outputs.date }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ vars.TELEGRAM_ALERT_CHAT_ID }}
        run: python3 scripts/notify_failure.py run_output.log
