name: Telegram Daily Push

# vault/push/YYYY-MM-DD.md 파일이 추가·변경될 때 자동 실행
on:
  push:
    branches: [main]
    paths:
      - 'vault/push/*.md'

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # HEAD~1 비교에 필요

      - name: Detect date from newly pushed push file
        id: detect
        run: |
          DATE=$(git diff --name-only HEAD~1 HEAD \
            | grep -E '^vault/push/[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$' \
            | sed 's|vault/push/||; s|\.md||' \
            | head -1)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Detected date: $DATE"

      - name: Send Telegram push
        if: steps.detect.outputs.date != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 scripts/send_push.py ${{ steps.detect.outputs.date }}
