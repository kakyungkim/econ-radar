name: Telegram Daily Push

# vault/push/YYYY-MM-DD.md 파일이 추가·변경될 때 자동 실행
# 수동 실행: Actions 탭 → Run workflow → date 입력 (YYYY-MM-DD)
on:
  push:
    branches: [main]
    paths:
      - 'vault/push/*.md'
  workflow_dispatch:
    inputs:
      date:
        description: '발송할 날짜 (YYYY-MM-DD). 비워두면 최신 push 파일 자동 감지.'
        required: false
        default: ''

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # HEAD~1 비교에 필요

      - name: Detect date
        id: detect
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE="${{ github.event.inputs.date }}"
          else
            DATE=$(git diff --name-only HEAD~1 HEAD \
              | grep -E '^vault/push/[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$' \
              | sed 's|vault/push/||; s|\.md||' \
              | head -1)
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Detected date: $DATE"

      - name: Send Telegram push
        if: steps.detect.outputs.date != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 scripts/send_push.py ${{ steps.detect.outputs.date }}
