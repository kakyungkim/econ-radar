name: Email Daily Push (Buttondown)

# vault/push/YYYY-MM-DD.md 가 추가·변경될 때 자동 실행(텔레그램과 같은 트리거).
# 이메일 HTML은 이 워크플로가 CI에서 render_html.py로 직접 생성하므로,
# 클라우드 데일리 루틴이 vault/email 을 커밋하든 안 하든 동작한다.
#
# 발송 모드(send_email.py): 기본 초안(draft) / EMAIL_SEND=1 → 다음날 아침 예약 / EMAIL_SEND=now → 즉시.
# 레포 Variable EMAIL_SEND 또는 수동 실행 시 send 입력으로 제어.
on:
  push:
    branches: [main]
    paths:
      - 'vault/push/*.md'
  workflow_dispatch:
    inputs:
      date:
        description: '발송할 날짜 (YYYY-MM-DD). 비워두면 최신 push 파일 자동 감지.'
        required: false
        default: ''
      send:
        description: "발송 모드: 1(다음날 아침 예약) / now(즉시) / 비움(초안)."
        required: false
        default: ''

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # before..HEAD 전체 범위 비교에 필요

      - name: Detect date
        id: detect
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE="${{ github.event.inputs.date }}"
          else
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="HEAD~1"
            fi
            DATE=$(git diff --name-only "$BEFORE" HEAD \
              | grep -E '^vault/push/[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$' \
              | sed 's|vault/push/||; s|\.md||' \
              | sort -r | head -1)
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Detected date: $DATE"

      - name: Render email HTML (CI)
        if: steps.detect.outputs.date != ''
        run: |
          # vault/daily/DATE.md 가 있어야 렌더 가능. 없으면(부분 발행 등) 조용히 건너뜀.
          if [ -f "vault/daily/${{ steps.detect.outputs.date }}.md" ]; then
            python3 scripts/render_html.py ${{ steps.detect.outputs.date }}
          else
            echo "daily md 없음 — 이메일 생략"
          fi

      - name: Send email via Buttondown
        if: steps.detect.outputs.date != ''
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          EMAIL_SEND: ${{ github.event.inputs.send || vars.EMAIL_SEND }}
        run: |
          if [ -f "vault/email/${{ steps.detect.outputs.date }}.html" ]; then
            python3 scripts/send_email.py ${{ steps.detect.outputs.date }}
          else
            echo "email html 없음 — 발송 생략"
          fi
