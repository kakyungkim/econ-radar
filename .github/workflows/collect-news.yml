name: collect-news

# RSS에서 뉴스 후보를 모아 vault/raw/feed-DATE.{json,md}로 커밋한다. 데일리 루틴(18:30 KST)이 읽는다.
# 정각 cron은 이 저장소에서 4~9시간 늦게 시작한 적이 있어 분을 어긋나게 둔다.
on:
  schedule:
    - cron: '17 6 * * *'   # 15:17 KST
    - cron: '43 8 * * *'   # 17:43 KST
  workflow_dispatch:
    inputs:
      date:
        description: '수집 기준일 YYYY-MM-DD (비우면 오늘 KST)'
        required: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: collect-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 날짜 결정
        run: |
          D="${{ github.event.inputs.date }}"
          if [ -z "$D" ]; then D=$(TZ=Asia/Seoul date +%F); fi
          echo "DATE=$D" >> "$GITHUB_ENV"

      - name: 수집
        run: python3 scripts/collect_news.py "$DATE"

      - name: 커밋과 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "vault/raw/feed-$DATE.json" "vault/raw/feed-$DATE.md"
          if git diff --cached --quiet; then
            echo "변경 없음"; exit 0
          fi
          git commit -m "econ-radar: $DATE 뉴스 후보 수집 (Actions)"
          for n in 1 2; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push 실패, 재시도 $n"; sleep 5
          done
          exit 1
