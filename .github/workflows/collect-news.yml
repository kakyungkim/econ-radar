name: collect-news

# RSS에서 뉴스 후보를 모아 vault/raw/feed-DATE.{json,md}로 커밋한다. 데일리 루틴(18:30 KST)이 읽는다.
# 예약 실행은 이 저장소에서 4~9시간 늦게 시작한다(2026-11-07: 15:17 예약이 22:09, 17:43 예약이 다음 날 00:08).
# 그래서 오전부터 두 시간 간격으로 다섯 번 걸어, 늦어도 하나는 18:30 루틴 전에 들어오게 한다. 뒤 실행이 앞 파일을 덮어 쓴다.
on:
  schedule:
    - cron: '17 0,2,4,6,8 * * *'   # 09:17, 11:17, 13:17, 15:17, 17:17 KST
  workflow_dispatch:
    inputs:
      date:
        description: '수집 기준일 YYYY-MM-DD (비우면 오늘 KST)'
        required: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: collect-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 날짜 결정
        run: |
          D="${{ github.event.inputs.date }}"
          # 자정을 넘겨 늦게 돈 실행이 다음 날 파일을 만들지 않게 6시간 전 날짜로 잡는다.
          if [ -z "$D" ]; then D=$(TZ=Asia/Seoul date -d '-6 hours' +%F); fi
          echo "DATE=$D" >> "$GITHUB_ENV"

      - name: 수집
        run: python3 scripts/collect_news.py "$DATE"

      - name: 커밋과 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "vault/raw/feed-$DATE.json" "vault/raw/feed-$DATE.md"
          if git diff --cached --quiet; then
            echo "변경 없음"; exit 0
          fi
          git commit -m "econ-radar: $DATE 뉴스 후보 수집 (Actions)"
          for n in 1 2; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push 실패, 재시도 $n"; sleep 5
          done
          exit 1
